# SCRAPLINE CI: every push and pull request.
#   engine  typecheck, unit tests, short Monte Carlo run (200k rounds per configuration)
#   server  typecheck + floating-promise check, tests on SQLite and on Postgres 16, two-instance cluster smoke test
#   web     typecheck, production build, self-contained browser demo
#   images  API and web Docker images (built, not pushed)
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: platform/engine/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Monte Carlo (short)
        run: npx esbuild sim/montecarlo.ts --bundle --platform=node --format=esm --outfile=.cache/sim.mjs && node .cache/sim.mjs 200000

  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/server } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: scrapline, POSTGRES_PASSWORD: ci, POSTGRES_DB: scrapline }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scrapline" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_BASE: postgres://scrapline:ci@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: platform/server/package-lock.json }
      - run: npm ci
      - run: npm run check
      - name: tests (SQLite)
        run: npm test
      - name: tests (Postgres)
        run: |
          psql "$PG_BASE/scrapline" -c 'CREATE DATABASE scrapline_test'
          TEST_PG_URL="$PG_BASE/scrapline_test" npm test
      - name: cluster smoke test (2 instances, 1 database)
        run: npm run build && DATABASE_URL="$PG_BASE/scrapline" node tools/cluster-smoke.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: platform/server
      - run: npm ci
        working-directory: platform/web
      - run: npm run typecheck && npm run build && npm run build:demo
        working-directory: platform/web

  images:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f platform/server/Dockerfile -t scrapline-api platform
      - run: docker build -f platform/web/Dockerfile -t scrapline-web platform
