# Static app + API reverse proxy. TLS terminates in front of this container (Cloudflare / load balancer),
# which also sets CF-IPCountry. Never let clients set that header themselves: nginx overwrites it only
# when the edge did not send one, so configure the edge to always send it in production.
map $http_cf_ipcountry $country { default $http_cf_ipcountry; "" "XX"; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /api/events { proxy_pass http://api:8787/events; include /etc/nginx/conf.d/sse.inc; }
  location = /api/crash/stream { proxy_pass http://api:8787/crash/stream; include /etc/nginx/conf.d/sse.inc; }
  location /api/ {
    proxy_pass http://api:8787/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header CF-IPCountry $country;
    client_max_body_size 16k;
    proxy_read_timeout 30s;
  }
  # No add_header inside locations: nginx would then drop the security headers above for that location.
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri /index.html; }
}
